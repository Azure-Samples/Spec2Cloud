<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Spec2Cloud Cockpit</title>
        <link rel="stylesheet" href="ui.css" />
    </head>
    <body>
        <div id="app">
            <!-- Header / workspace + session stats -->
            <header class="topbar">
                <div class="title-row">
                    <div class="brand">
                        <div class="brand-text">
                            <div class="brand-title" id="ws-repo">—</div>
                        </div>
                    </div>
                    <button class="iconbtn" id="btn-session" data-tip="Session details">
                        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0ZM7 4.75a1 1 0 1 1 2 0 1 1 0 0 1-2 0ZM6.75 7h1.5c.41 0 .75.34.75.75V11h.5a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5h.5V8.5h-.5a.75.75 0 0 1 0-1.5Z"/></svg>
                    </button>
                </div>
                <div class="top-right">
                    <span class="status-pill" id="session-status">
                        <span class="dot"></span><span class="status-label">—</span>
                    </span>
                    <span class="pill" id="ws-branch" title="Git branch"></span>
                    <span class="pill model" id="ws-model" title="Active model"></span>

                    <div class="chips">
                        <div class="chip hoverable" id="stat-mcp" title="MCP / external tools — click for details">
                            <span class="chip-ico"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M5.433 2.304A4.492 4.492 0 0 0 3.5 6c0 1.598.832 3.002 2.09 3.802.518.328.929.923.902 1.64v.008l-.164 3.337a.75.75 0 1 1-1.498-.073l.163-3.33c.002-.085-.05-.216-.207-.316A5.996 5.996 0 0 1 2 6a5.993 5.993 0 0 1 2.567-4.92 1.482 1.482 0 0 1 1.673-.04c.462.296.76.827.76 1.423v2.82c0 .082.041.16.11.206l.75.51a.25.25 0 0 0 .28 0l.75-.51A.249.249 0 0 0 9 5.282V2.463c0-.596.298-1.127.76-1.423a1.482 1.482 0 0 1 1.673.04A5.993 5.993 0 0 1 14 6a5.996 5.996 0 0 1-2.786 5.068c-.157.1-.209.23-.207.315l.163 3.33a.752.752 0 0 1-1.094.714.75.75 0 0 1-.404-.64l-.164-3.345c-.027-.717.384-1.312.902-1.64A4.495 4.495 0 0 0 12.5 6a4.492 4.492 0 0 0-1.933-3.696c-.024.017-.067.067-.067.16v2.818a1.75 1.75 0 0 1-.767 1.448l-.75.51a1.75 1.75 0 0 1-1.966 0l-.75-.51A1.75 1.75 0 0 1 5.5 5.282V2.463c0-.092-.043-.142-.067-.159Z"/></svg></span>
                            <span class="chip-val" data-field="mcp">0</span>
                            <div class="hovercard" id="hc-mcp"></div>
                        </div>
                        <div class="chip hoverable" id="stat-skills" title="Skills — click for details">
                            <span class="chip-ico"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M9.6 2.279a.426.426 0 0 1 .8 0l.407 1.112a6.386 6.386 0 0 0 3.802 3.802l1.112.407a.426.426 0 0 1 0 .8l-1.112.407a6.386 6.386 0 0 0-3.802 3.802l-.407 1.112a.426.426 0 0 1-.8 0l-.407-1.112a6.386 6.386 0 0 0-3.802-3.802L4.279 8.4a.426.426 0 0 1 0-.8l1.112-.407a6.386 6.386 0 0 0 3.802-3.802L9.6 2.279Zm-4.267 8.837a.178.178 0 0 1 .334 0l.169.464a2.662 2.662 0 0 0 1.584 1.584l.464.169a.178.178 0 0 1 0 .334l-.464.169a2.662 2.662 0 0 0-1.584 1.584l-.169.464a.178.178 0 0 1-.334 0l-.169-.464a2.662 2.662 0 0 0-1.584-1.584l-.464-.169a.178.178 0 0 1 0-.334l.464-.169a2.662 2.662 0 0 0 1.584-1.584l.169-.464ZM2.8.14a.213.213 0 0 1 .4 0l.203.556a3.2 3.2 0 0 0 1.901 1.901l.556.203a.213.213 0 0 1 0 .4l-.556.203a3.2 3.2 0 0 0-1.901 1.901L3.2 5.86a.213.213 0 0 1-.4 0l-.203-.556A3.2 3.2 0 0 0 .696 3.403L.14 3.2a.213.213 0 0 1 0-.4l.556-.203A3.2 3.2 0 0 0 2.597.696L2.8.14Z"/></svg></span>
                            <span class="chip-val" data-field="skills">0</span>
                            <div class="hovercard" id="hc-skills"></div>
                        </div>
                        <div class="chip hoverable" id="stat-tokens" title="Token usage — click for details">
                            <span class="chip-ico"><svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M5.75 0a.75.75 0 0 1 .75.75V2h3V.75a.75.75 0 0 1 1.5 0V2h.25A1.75 1.75 0 0 1 13 3.75V4h1.25a.75.75 0 0 1 0 1.5H13v3h1.25a.75.75 0 0 1 0 1.5H13v.25A1.75 1.75 0 0 1 11.25 12H11v1.25a.75.75 0 0 1-1.5 0V12h-3v1.25a.75.75 0 0 1-1.5 0V12h-.25A1.75 1.75 0 0 1 3 10.25V10H1.75a.75.75 0 0 1 0-1.5H3v-3H1.75a.75.75 0 0 1 0-1.5H3v-.25A1.75 1.75 0 0 1 4.75 2H5V.75A.75.75 0 0 1 5.75 0Zm-1 3.5a.25.25 0 0 0-.25.25v6.5c0 .138.112.25.25.25h6.5a.25.25 0 0 0 .25-.25v-6.5a.25.25 0 0 0-.25-.25ZM6 6h4v4H6Z"/></svg></span>
                            <span class="chip-val" data-field="tokens">0</span>
                            <div class="hovercard" id="hc-tokens"></div>
                        </div>
                    </div>

                    <button class="iconbtn" id="btn-todos" data-tip="Session todos">
                        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M1.5 2.75A.75.75 0 0 1 2.25 2h11.5a.75.75 0 0 1 0 1.5H2.25a.75.75 0 0 1-.75-.75Zm0 5A.75.75 0 0 1 2.25 7h11.5a.75.75 0 0 1 0 1.5H2.25a.75.75 0 0 1-.75-.75Zm0 5a.75.75 0 0 1 .75-.75h11.5a.75.75 0 0 1 0 1.5H2.25a.75.75 0 0 1-.75-.75Z"/></svg>
                        <span class="iconbtn-label" id="todo-count">0</span>
                    </button>
                </div>
            </header>

            <!-- Environments -->
            <section class="env-row" id="env-row" hidden>
                <label class="env-label" for="env-select">Environment</label>
                <select id="env-select" class="env-select"></select>
                <div class="env-actions">
                    <button class="iconbtn envbtn" id="btn-env" data-tip=".env file">
                        <svg viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M8 0a8.2 8.2 0 0 1 .701.031C9.444.095 9.99.645 10.16 1.29l.288 1.107c.018.066.079.158.212.224.231.114.454.243.668.386.123.082.233.09.299.071l1.103-.303c.644-.176 1.392.021 1.82.63.27.385.506.792.704 1.218.315.675.111 1.422-.364 1.891l-.814.806c-.049.048-.098.147-.088.294.016.257.016.515 0 .772-.01.147.038.246.088.294l.814.806c.475.469.679 1.216.364 1.891a7.977 7.977 0 0 1-.704 1.217c-.428.61-1.176.807-1.82.63l-1.102-.302c-.067-.019-.177-.011-.3.071a5.909 5.909 0 0 1-.668.386c-.133.066-.194.158-.211.224l-.29 1.106c-.168.646-.715 1.196-1.458 1.26a8.006 8.006 0 0 1-1.402 0c-.743-.064-1.289-.614-1.458-1.26l-.289-1.106c-.018-.066-.079-.158-.212-.224a5.738 5.738 0 0 1-.668-.386c-.123-.082-.233-.09-.299-.071l-1.103.303c-.644.176-1.392-.021-1.82-.63a8.12 8.12 0 0 1-.704-1.218c-.315-.675-.111-1.422.363-1.891l.815-.806c.05-.048.098-.147.088-.294a6.214 6.214 0 0 1 0-.772c.01-.147-.038-.246-.088-.294l-.815-.806C.635 6.045.431 5.298.746 4.623a7.92 7.92 0 0 1 .704-1.217c.428-.61 1.176-.807 1.82-.63l1.102.302c.067.019.177.011.3-.071.214-.143.437-.272.668-.386.133-.066.194-.158.211-.224l.29-1.106C6.009.645 6.556.095 7.299.03 7.53.01 7.764 0 8 0Zm-.571 1.525c-.036.003-.108.036-.137.146l-.289 1.105c-.147.561-.549.967-.998 1.189-.173.086-.34.183-.5.29-.417.278-.97.423-1.529.27l-1.103-.303c-.109-.03-.175.016-.195.045-.22.312-.412.644-.573.99-.014.031-.021.11.059.19l.815.806c.411.406.562.957.53 1.456a4.709 4.709 0 0 0 0 .582c.032.499-.119 1.05-.53 1.456l-.815.806c-.081.08-.073.159-.059.19.162.346.353.677.573.989.02.03.085.076.195.046l1.102-.303c.56-.153 1.113-.008 1.53.27.161.107.328.204.501.29.447.222.85.629.997 1.189l.289 1.105c.029.109.101.143.137.146a6.6 6.6 0 0 0 1.142 0c.036-.003.108-.036.137-.146l.289-1.105c.147-.561.549-.967.998-1.189.173-.086.34-.183.5-.29.417-.278.97-.423 1.529-.27l1.103.303c.109.029.175-.016.195-.045.22-.313.411-.644.573-.99.014-.031.021-.11-.059-.19l-.815-.806c-.411-.406-.562-.957-.53-1.456a4.709 4.709 0 0 0 0-.582c-.032-.499.119-1.05.53-1.456l.815-.806c.081-.08.073-.159.059-.19a6.464 6.464 0 0 0-.573-.989c-.02-.03-.085-.076-.195-.046l-1.102.303c-.56.153-1.113.008-1.53-.27a4.44 4.44 0 0 0-.501-.29c-.447-.222-.85-.629-.997-1.189l-.289-1.105c-.029-.11-.101-.143-.137-.146a6.6 6.6 0 0 0-1.142 0ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM9.5 8a1.5 1.5 0 1 0-3.001.001A1.5 1.5 0 0 0 9.5 8Z"/></svg>
                    </button>
                    <button class="iconbtn envbtn" id="btn-rg" data-tip="Resource group">
                        <img class="azure-ico" src="icons/azure.svg" width="16" height="16" alt="" />
                    </button>
                    <button class="iconbtn envbtn" id="btn-foundry" data-tip="Foundry project" hidden>
                        <img class="azure-ico" src="icons/foundry.svg" width="16" height="16" alt="" />
                    </button>
                </div>
            </section>

            <!-- Pipeline -->
            <section class="pipeline-card">
                <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="pipeline" id="pipeline"></div>
            </section>

            <!-- Details panel -->
            <section class="details" id="details" hidden>
                <div class="details-head">
                    <span class="details-title" id="details-title">Details</span>
                    <button class="details-close" id="details-close" aria-label="Close">✕</button>
                </div>
                <div class="details-body" id="details-body"></div>
            </section>

            <footer class="footer">
                <span id="conn-state">connecting…</span>
                <span id="gen-time"></span>
            </footer>
        </div>
        <script src="ui.js"></script>
    </body>
</html>
